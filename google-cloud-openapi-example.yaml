# Render the Cloud Run URL before creating the API config. See docs/google-cloud.md.
openapi: 3.0.4
info:
  title: Order Demo API
  version: 1.0.0
x-google-api-management:
  backends:
    order-backend:
      address: https://replace-with-your-cloud-run-url.run.app
      jwtAudience: https://replace-with-your-cloud-run-url.run.app
      pathTranslation: APPEND_PATH_TO_ADDRESS
      protocol: http/1.1
  mcp:
    tools-list:
      security:
        google_api_key: []
x-google-backend: order-backend
security:
  - google_api_key: []
components:
  securitySchemes:
    google_api_key:
      type: apiKey
      name: x-api-key
      in: header
  schemas:
    OrderRequest:
      type: object
      required: [sku, quantity]
      properties:
        sku:
          type: string
          minLength: 1
          example: SKU-A01
        quantity:
          type: integer
          format: int64
          minimum: 1
          example: 2
paths:
  /orders:
    get:
      operationId: list_order
      summary: List orders and their current status.
      x-google-mcp-tool: true
      responses:
        '200': {description: Order list}
    post:
      operationId: create_order
      summary: Create a paid demo order.
      x-google-mcp-tool: false
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OrderRequest'}
      responses:
        '201': {description: Created order}
        '404': {description: SKU not found}
        '422': {description: Invalid order request}
  /orders/{order_id}:
    get:
      operationId: get_order
      summary: Look up an order by ID before checking inventory.
      x-google-mcp-tool: true
      parameters:
        - in: path
          name: order_id
          required: true
          schema: {type: string}
      responses:
        '200': {description: Order record}
        '404': {description: Order not found}
  /inventory:
    get:
      operationId: list_sku
      summary: List SKUs and their available inventory.
      x-google-mcp-tool: true
      responses:
        '200': {description: SKU list}
  /inventory/{sku}:
    get:
      operationId: check_inventory
      summary: Check the available quantity of a SKU.
      x-google-mcp-tool: true
      parameters:
        - in: path
          name: sku
          required: true
          schema: {type: string}
      responses:
        '200': {description: Inventory record}
        '404': {description: SKU not found}
  /shipments:
    post:
      operationId: create_shipment
      summary: Create a shipment for a paid order after explicit user approval.
      x-google-mcp-tool: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_id]
              properties:
                order_id: {type: string}
      responses:
        '200': {description: Created shipment}
        '404': {description: Order not found}
        '409': {description: Order cannot ship}
        '422': {description: Invalid shipment request}
# Manager cancellation is intentionally omitted from the public gateway.
